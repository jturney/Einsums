name: einsums-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - sphinx
  - sphinx-design
  - sphinx-copybutton
  - sphinxcontrib-bibtex
  - sphinxcontrib-qthelp
  - six
  - pydata-sphinx-theme
  - doxygen
  - breathe
  - docutils
  # docs/tools/generate_arguments_rst.py reads the prose sidecar for the argument
  # reference, so the docs build needs a YAML parser. Listed rather than relied on
  # transitively: it arrives with sphinx's dependencies today, which is not a
  # promise, and the docs build fails without it.
  - pyyaml
