coverage:
  status:
    project:
      default:
        threshold: 100%
    patch:
      default:
        threshold: 100%
  ignore:
    # Anchored at the repo root, so a bare "tests/" matched nothing: every test
    # lives at libs/Einsums/<Module>/tests/, and the doctests at docs/doctests/.
    # lcov excludes both at capture time too, so the two agree; that exclusion
    # turned out to change the report rather than the runtime, since geninfo
    # reads every .gcda and filters afterwards.
    - "**/tests/**"
    - "**/doctests/**"
