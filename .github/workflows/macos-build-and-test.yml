name: macOS build and test workflow
on:
  workflow_call:
    inputs:
      full_matrix:
        description: "Also build the Debug configuration (~35 min). Per-PR runs default to RelWithDebInfo-only; the nightly passes true."
        type: boolean
        required: false
        default: false
      build_ref:
        type: string
        required: false
      build_cache_suffix:
        type: string
        required: false
        default: "default"
      build_cache_size:
        type: string
        required: false
        default: 2G
      build_configure_extra_args:
        type: string
        required: false

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(inputs.full_matrix && '["Debug","RelWithDebInfo"]' || '["RelWithDebInfo"]') }}

    name: "default • accelerate • ${{ matrix.build_type }}"
    runs-on: macos-latest
    env:
      CCACHE_DIR: $GITHUB_WORKSPACE/build_cache_${{ inputs.build_cache_suffix }}
      CCACHE_MAXSIZE: ${{ inputs.build_cache_size }}
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref }}
          path: src

      - name: Cache Build Cache
        uses: actions/cache@v6
        with:
          path: build_cache_${{ inputs.build_cache_suffix }}
          key: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-${{ github.sha }}
          restore-keys: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-

      - name: Set up conda environment
        uses: ./src/.github/actions/setup-conda-env
        with:
          compiler: default
          blas: accelerate
          source-dir: src

      - name: Configure CMake
        run: |
          cmake \
            -G Ninja \
            -S "$GITHUB_WORKSPACE/src" \
            -B "$GITHUB_WORKSPACE/build" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D CMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D CMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D CMAKE_OBJCXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D CMAKE_C_FLAGS_DEBUG="-g0" \
            -D CMAKE_CXX_FLAGS_DEBUG="-g0" \
            -D CMAKE_OBJCXX_FLAGS_DEBUG="-g0" \
            -D EINSUMS_SHOW_WARNING=OFF \
            -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/installed" \
            -D CMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            -D EINSUMS_WITH_COVERAGE=ON \
            -D EINSUMS_BUILD_PYTHON=ON \
            -D Python_EXECUTABLE="${CONDA_PREFIX}/bin/python3" \
            -D EINSUMS_WITH_BACKTRACES=OFF \
            ${{ inputs.build_configure_extra_args }}

      - name: Build and Install
        run: |
          cmake --build "${{ github.workspace }}/build" --config Release --target install

      # The Python test suite is registered as ctest entries (labelled PYTHON)
      # by einsums_add_python_unit_test, so this single ctest run exercises both
      # the C++ and the Python bindings — no separate pytest step is needed.
      - name: ccache statistics
        run: ccache -sv 2>/dev/null || ccache -s

      - name: Test (CTest) - Unit Tests
        working-directory: "${{ github.workspace }}/build"
        env:
          # See the Linux workflow: stacks of every thread when a python test
          # stops making progress, which ctest's timeout report does not carry.
          EINSUMS_TEST_STACKDUMP_DIR: "${{ github.workspace }}/stackdumps"
          # The tier measurement, per leg. This is the leg that matters most to
          # it: Accelerate is where PermuteFusion stopped being bit-identical,
          # which is what made a one-machine classification untrustworthy.
          EINSUMS_TIER_REPORT_DIR: "${{ github.workspace }}/tier-reports"
          EINSUMS_TIER_LABEL: "macos-accelerate-${{ matrix.build_type }}"
        run: ctest --rerun-failed --output-on-failure -j3

      - name: Upload hung-test stack dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # build_type is what this workflow's matrix varies, and
          # upload-artifact rejects a duplicate name within a run.
          name: macos-stackdumps-${{ matrix.build_type }}
          path: "${{ github.workspace }}/stackdumps"
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload tier measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-tier-report-${{ matrix.build_type }}
          path: "${{ github.workspace }}/tier-reports"
          if-no-files-found: ignore
          retention-days: 14


      - name: Generate coverage information
        working-directory: "${{github.workspace}}/build"
        run: |
          export PROFILES=$(find . -name "*.profraw")
          echo "PROFILES=$PROFILES"
          # --failure-mode=warn: a stray/truncated default.profraw (an instrumented
          # binary that ran without LLVM_PROFILE_FILE set) is occasionally malformed
          # ("symbol name is empty") and would otherwise fail the whole merge. Warn
          # and skip the bad file instead of erroring; valid coverage is kept.
          llvm-profdata merge --failure-mode=warn $PROFILES -o default.profdata

          # Every object goes through -object. llvm-cov takes ONE binary
          # positionally and silently ignores any further positional arguments,
          # so the previous `... -instr-profile=X $BINARIES` exported whichever
          # test binary `find` happened to list first and dropped all the rest.
          #
          # libEinsums is in the list because it is a shared library. Coverage
          # used to force a static one (see libs/CMakeLists.txt, where that is
          # now fixed), which copied the library's code into every test binary so
          # it came along for free. Its coverage mapping now lives in the dylib
          # alone, and omitting it would report the test sources and almost
          # nothing else: measured locally on one test, 15 source files without
          # it against 331 with it.
          #
          # -type f skips the version symlinks sitting beside the real dylib,
          # which llvm-cov would otherwise load again under another name.
          OBJECTS=()
          for _obj in $(find . -type f -name "*_test") \
                      $(find ./lib -type f -name "libEinsums-abi*.dylib"); do
            OBJECTS+=(-object "${_obj}")
          done
          echo "objects:"; printf '  %s\n' "${OBJECTS[@]}"
          llvm-cov export -format=lcov -ignore-filename-regex="_deps|einsums-env" -instr-profile=default.profdata "${OBJECTS[@]}" > coverage.info

      - name: Upload C++ coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: "${{github.workspace}}/src"
          working-directory: "${{github.workspace}}/src"
          disable_search: true
          files: ${{github.workspace}}/build/coverage.info
          flags: cpp,mac
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test (find_package) - consume installation
        working-directory: "${{github.workspace}}/src/testing/consume"
        shell: bash -l {0}
        run: |
          cmake -S . \
            -B build \
            -G Ninja \
            --log-level verbose \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX};${CONDA_PREFIX}/Library;${{ github.workspace }}/installed"
          cmake --build build
          ./build/HelloWorld
