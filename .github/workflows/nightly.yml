name: Nightly

# Everything the per-PR CMake workflow runs, plus the expensive legs that are
# too slow to run per-PR: the full sanitizer set (address/leak/undefined,
# ~1.5h) and the macOS Debug build (~35 min). Runs against main every night;
# dispatch manually to aim it at a branch.
#
# The job list here must stay a superset of cmake.yml's. It did not, and the
# gap cost real time: Windows was missing, so a Windows-only regression had
# nothing watching for it between PRs. If you add a leg to cmake.yml, add it
# here too (and vice versa) - nothing enforces this automatically.
#
# Two deliberate differences from cmake.yml, both of which should stay:
#
#   * No detect_changes gating. That workflow skips legs whose paths did not
#     change, which is the right economy for a PR and the wrong one for a
#     nightly: the point of running against main every night is to catch what
#     a path filter would not have predicted - a submodule bump, a toolchain
#     update on the runner image, a latent bug a fuzzer finally reaches.
#
#   * No Linux/intel leg. icpx's per-TU memory exceeds ubuntu-latest's 16GB
#     even at -O0 -j1 and OOM-kills the runner, which is why cmake.yml gates
#     it to workflow_dispatch. It is not part of a regular PR run, and on a
#     schedule it would simply fail every night.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/linux-build-and-test.yml

  windows:
    name: Windows
    uses: ./.github/workflows/windows-build-and-test.yml

  macos_full:
    name: macOS (full)
    uses: ./.github/workflows/macos-build-and-test.yml
    with:
      full_matrix: true

  sanitizers_full:
    name: Sanitizers (full)
    uses: ./.github/workflows/linux-build-and-test-sanitizer.yml
    with:
      full_matrix: true

  # Build only. The deploy steps are gated on the upstream repository and on a
  # push or manual dispatch, so a scheduled run publishes nothing - it just
  # proves the generator still walks the whole header surface, which a
  # submodule bump can break without matching any path filter.
  #
  # The write permission is granted here rather than at the top of the file so
  # every other leg stays read-only. docs.yml declares `contents: write` for
  # its deploy steps, and a called workflow cannot hold more than its caller
  # grants: under this workflow's `read-all` the run fails at startup, before
  # any job begins, whether or not those steps would have been reached.
  documentation:
    name: Documentation
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
