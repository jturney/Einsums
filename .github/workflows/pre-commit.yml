name: Pre-Commit Checks
on:
  pull_request:
  # Push too, so forks that develop on main still run it.
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: "Detect Changes"
    uses: ./.github/workflows/detect-changes.yml

  format:
    name: Format Files
    needs: [ detect_changes ]
    if: ${{ contains(needs.detect_changes.outputs.filters, 'cmake') || contains(needs.detect_changes.outputs.filters, 'cpp') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # Report, do not auto-fix and push: that fails for forks, moves the branch under the author,
      # and breaks on check-only hooks.
      - name: Run pre-commit hooks
        run: |
          if ! pre-commit run --all-files --show-diff-on-failure; then
            echo "::error::pre-commit found problems. Run 'pre-commit run --all-files' locally, review the changes, and commit them. Install the hooks once with 'pre-commit install' so this happens before you push."
            exit 1
          fi
