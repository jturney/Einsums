name: Pre-Commit Checks
on:
  pull_request:
  # Without this the workflow only ever fires on pull requests, so a fork whose
  # development happens as direct pushes to main never runs it at all - which
  # was the case here: zero runs on the fork, and none anywhere since
  # 2026-06-06.
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  #  Cancel a currently running workflow from the same PR or commit hash.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: "Detect Changes"
    uses: ./.github/workflows/detect-changes.yml

  format:
    name: Format Files
    needs: [ detect_changes ]
    if: ${{ contains(needs.detect_changes.outputs.filters, 'cmake') || contains(needs.detect_changes.outputs.filters, 'cpp') }}
    runs-on: ubuntu-latest
    # Read-only. The write permissions this job used to carry existed solely to
    # push an auto-format commit back onto the contributor's branch.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # Report, do not repair. This used to rewrite the files and push a bot
      # commit back to the branch, which:
      #
      #   - only worked for same-repo PRs, so fork contributors already got a
      #     plain failure and a different experience for the same mistake;
      #   - moved the contributor's branch under them, so their next push
      #     needed a pull first;
      #   - could land a commit after review approval, changing what was
      #     reviewed; and
      #   - assumed every hook REWRITES files. A checking hook that merely
      #     reports (cmake-audit, the namespace-macro guard) left nothing
      #     staged, so `git commit` failed with "nothing to commit" and buried
      #     the real diagnosis.
      #
      # Installing the hooks locally is already the documented workflow; see
      # docs/sphinx/contributors/style.rst.
      - name: Run pre-commit hooks
        run: |
          if ! pre-commit run --all-files --show-diff-on-failure; then
            echo "::error::pre-commit found problems. Run 'pre-commit run --all-files' locally, review the changes, and commit them. Install the hooks once with 'pre-commit install' so this happens before you push."
            exit 1
          fi
