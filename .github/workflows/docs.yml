name: Documentation

on:
  workflow_call:
    inputs:
      build_ref:
        type: string
        required: false
      build_cache_suffix:
        type: string
        required: false
        default: "default"
      build_cache_size:
        type: string
        required: false
        default: 2G
      build_configure_extra_args:
        type: string
        required: false
  # Manual rehearsal: builds and deploys a full miniature site (version dir,
  # root redirect, switcher) under /dev-preview/ without touching the real
  # versions or the site root.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build job
  build:
    defaults:
      run:
        shell: bash -el {0}
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: $GITHUB_WORKSPACE/build_cache_${{ inputs.build_cache_suffix }}
      CCACHE_MAXSIZE: ${{ inputs.build_cache_size }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref }}

      - name: Cache Build Cache
        uses: actions/cache@v6
        with:
          path: build_cache_${{ inputs.build_cache_suffix }}
          key: einsums-docs-${{ runner.os }}-${{ inputs.build_cache_suffix }}-${{ github.sha }}
          restore-keys: einsums-docs-${{ runner.os }}-${{ inputs.build_cache_suffix }}-

      - name: Set up conda environment
        uses: ./.github/actions/setup-conda-env
        with:
          compiler: default
          blas: openblas
          docs: "true"
          source-dir: "."

      - name: Configure CMake
        run: |
          cmake \
            -G Ninja \
            -S "$GITHUB_WORKSPACE" \
            -B "$GITHUB_WORKSPACE/build" \
            -D EINSUMS_BUILD_PYTHON=ON \
            -D Python_EXECUTABLE="${CONDA_PREFIX}/bin/python3" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_C_FLAGS_DEBUG="-g0" \
            -D CMAKE_CXX_FLAGS_DEBUG="-g0" \
            -D EINSUMS_SHOW_WARNING=OFF \
            -D EINSUMS_WITH_DOCUMENTATION=ON \
            -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/installed" \
            -D CMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            ${{ inputs.build_configure_extra_args }}

      - name: Build Documentation
        # The docs are generated statically from the headers by the apiary
        # libclang tool; the `docs` target pulls in that tool and the codegen, so
        # there is no need to compile/link the Einsums library or the PyEinsums
        # (_core) extension first. EINSUMS_BUILD_PYTHON stays ON because the docs
        # include a Python API reference (apiary --emit-docs-json per module);
        # docs/CMakeLists.txt errors without it.
        run: |
          cmake --build "${{ github.workspace }}/build" --config Debug --target docs -j4

      - name: Copy Documentation
        run: |
          mkdir -p ${{ github.workspace }}/share/Einsums/docs/html
          cp -rv ${{ github.workspace }}/build/share/Einsums/docs/html/* ${{ github.workspace }}/share/Einsums/docs/html

      # The site is versioned: main deploys to /latest/, tags to /vX.Y.Z/, and
      # the root gets a redirect page plus a switcher.json regenerated from
      # every version directory present on gh-pages. A workflow_dispatch run
      # rehearses the whole layout under /dev-preview/ instead.
      - name: Compute deploy target
        id: target
        if: github.repository == 'Einsums/Einsums' && ( github.event_name == 'workflow_dispatch' || ( github.event_name == 'push' && ( startsWith( github.ref, 'refs/tags/' ) || github.ref == 'refs/heads/main' ) ) )
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "html_folder=dev-preview/latest" >> "$GITHUB_OUTPUT"
            echo "root_folder=dev-preview" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              echo "html_folder=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            else
              echo "version=latest" >> "$GITHUB_OUTPUT"
              echo "html_folder=latest" >> "$GITHUB_OUTPUT"
            fi
            echo "root_folder=." >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble site root (redirect + switcher)
        if: steps.target.outputs.version
        run: |
          git fetch origin gh-pages --depth 1 || true
          mkdir -p site-root
          python .github/scripts/generate_switcher.py \
            --deploying "${{ steps.target.outputs.version }}" \
            --out site-root/switcher.json
          cp .github/pages-root/index.html site-root/index.html
          touch site-root/.nojekyll

      - name: Deploy version directory
        uses: JamesIves/github-pages-deploy-action@v4
        if: steps.target.outputs.version
        with:
          branch: gh-pages
          folder: ${{ github.workspace }}/share/Einsums/docs/html
          target-folder: ${{ steps.target.outputs.html_folder }}

      # clean: false so this touches only the three root files and never
      # deletes the other version directories.
      - name: Deploy site root
        uses: JamesIves/github-pages-deploy-action@v4
        if: steps.target.outputs.version
        with:
          branch: gh-pages
          folder: site-root
          target-folder: ${{ steps.target.outputs.root_folder }}
          clean: false
