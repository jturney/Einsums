name: Linux build and test workflow
on:
  workflow_call:
    inputs:
      build_ref:
        type: string
        required: false
      build_cache_suffix:
        type: string
        required: false
        default: "default"
      build_cache_size:
        type: string
        required: false
        default: 2G
      build_configure_extra_args:
        type: string
        required: false
      # Nightly only: reruns fuzz/property tests on one leg with scaled-up sample counts.
      long_fuzz:
        type: boolean
        required: false
        default: false

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # default = gcc. Intel lives in linux-intel-build.yml (manual only, see there).
        compiler: [ default, clang ]
        blas: [ openblas, mkl ]
        build_type: [ RelWithDebInfo ]
        variant: [ default ]
        include:
          # Keyed on blas too, or coverage merges into both default legs and runs twice.
          - compiler: default
            blas: openblas
            cmake_extra: >
              -DEINSUMS_WITH_COVERAGE=ON
          # Experimental is OFF by default and nothing else builds it; rides the gcc/MKL leg.
          - compiler: default
            blas: mkl
            cmake_extra: >
              -DEINSUMS_WITH_EXPERIMENTAL=ON
          # The only leg that compiles the PROFILER=OFF no-op shims.
          - compiler: clang
            blas: openblas
            build_type: RelWithDebInfo
            variant: no-profiler
            cmake_extra: >
              -DEINSUMS_WITH_PROFILER=OFF
          # Discrete mock GPU: the only leg that runs the executor's host/device transfer path
          # (the unified mock skips it). Keep Python ON; the transfer-ownership tests are Python.
          - compiler: default
            blas: openblas
            build_type: RelWithDebInfo
            variant: mock-discrete
            cmake_extra: >
              -DEINSUMS_WITH_GPU_MOCK_DISCRETE=ON
          # Free-threaded CPython. Python_FIND_ABI's 4th field selects the t-build;
          # without it FindPython silently falls back to another interpreter.
          - compiler: default
            blas: openblas
            build_type: RelWithDebInfo
            variant: free-threaded
            free_threaded: true
            cmake_extra: >
              -DPython_FIND_ABI="OFF;ANY;ANY;ON"
              -DPython_ROOT_DIR="$CONDA_PREFIX"
              -DPython_FIND_STRATEGY=LOCATION
        exclude:
          - compiler: clang
            blas: mkl

    name: "${{ matrix.compiler }} • ${{ matrix.blas }} • ${{ matrix.build_type }} • ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: $GITHUB_WORKSPACE/build_cache_${{ inputs.build_cache_suffix }}
      CCACHE_MAXSIZE: ${{ inputs.build_cache_size }}
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref }}
          path: src

      - name: Cache Build Cache
        uses: actions/cache@v6
        with:
          path: build_cache_${{ inputs.build_cache_suffix }}
          key: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}-

      - name: Set up conda environment
        uses: ./src/.github/actions/setup-conda-env
        with:
          compiler: ${{ matrix.compiler }}
          blas: ${{ matrix.blas }}
          source-dir: src
          free-threaded: ${{ matrix.free_threaded == true }}

      - name: Configure CMake
        run: |
          cmake \
            -G Ninja \
            -S "$GITHUB_WORKSPACE/src" \
            -B "$GITHUB_WORKSPACE/build" \
            -D EINSUMS_BUILD_PYTHON=ON \
            -D Python_EXECUTABLE="${CONDA_PREFIX}/bin/python3" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D CMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D CMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D EINSUMS_SHOW_WARNING=OFF \
            -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/installed" \
            -D CMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            ${{ matrix.cmake_extra }} ${{ inputs.build_configure_extra_args }}

      - name: Build and Install
        run: |
          # -j3: ninja's default parallelism OOM-kills the 16GB runner.
          cmake --build "${{ github.workspace }}/build" --config Release --target install -j3

      - name: ccache statistics
        run: ccache -sv 2>/dev/null || ccache -s

      - name: Test (CTest) - Unit Tests
        working-directory: "${{ github.workspace }}/build"
        env:
          # Hung python tests dump thread stacks here (root conftest.py); ctest drops a timed-out test's output.
          EINSUMS_TEST_STACKDUMP_DIR: "${{ github.workspace }}/stackdumps"
          # Per-leg pass tier measurement: bit-identity differs between BLAS libraries.
          EINSUMS_TIER_REPORT_DIR: "${{ github.workspace }}/tier-reports"
          EINSUMS_TIER_LABEL: "linux-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}"
        run: ctest --rerun-failed --output-on-failure -j4

      # One leg only, the one without coverage instrumentation or a variant switch.
      - name: Test (CTest) - Long fuzz
        if: inputs.long_fuzz && matrix.compiler == 'clang' && matrix.blas == 'openblas' && matrix.variant == 'default'
        working-directory: "${{ github.workspace }}/build"
        env:
          EINSUMS_FUZZ_SCALE: "20"
          EINSUMS_TEST_STACKDUMP_DIR: "${{ github.workspace }}/stackdumps"
        run: ctest -L PYTHON -R "Fuzz|Hyp" --output-on-failure -j4 --timeout 7200

      - name: Upload hung-test stack dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # upload-artifact rejects duplicate names within a run, so name by matrix coordinates.
          name: linux-stackdumps-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}
          path: "${{ github.workspace }}/stackdumps"
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload tier measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-tier-report-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}
          path: "${{ github.workspace }}/tier-reports"
          if-no-files-found: ignore
          retention-days: 14

      # Without PYTHON_GIL=0 CPython re-enables the GIL on import (_core lacks Py_MOD_GIL_NOT_USED).
      - name: Test (CTest) - Python suite with the GIL disabled
        if: ${{ matrix.variant == 'free-threaded' }}
        working-directory: "${{ github.workspace }}/build"
        # PYTHON_GIL is not a step env var: the login shell's conda activation runs a non-t Python,
        # which aborts with it set.
        run: |
          # The interpreter CMake resolved: the env's default `python` may be non-t and abort under PYTHON_GIL=0.
          PY=$(grep '^Python_EXECUTABLE:' CMakeCache.txt | cut -d= -f2-)
          echo "using $PY"
          PYTHONPATH="${{ github.workspace }}/build/lib" PYTHON_GIL=0 "$PY" -c "
          import sys, einsums
          assert not sys._is_gil_enabled(), 'importing einsums re-enabled the GIL'
          print('GIL still disabled after importing einsums')
          "
          EINSUMS_TEST_STACKDUMP_DIR="${{ github.workspace }}/stackdumps" \
            PYTHON_GIL=0 ctest -L PYTHON --output-on-failure -j4

      - name: Generate coverage information
        if: ${{ matrix.compiler == 'default' && matrix.blas == 'openblas' && matrix.variant == 'default' }}
        working-directory: "${{github.workspace}}/build"
        run: |
          # Conda's gcov is arch-prefixed; there is no bare ${CONDA_PREFIX}/bin/gcov.
          GCOV=""
          for candidate in "${CONDA_PREFIX}"/bin/*-conda-linux-gnu-gcov; do
              if [[ -x "$candidate" ]]; then GCOV="$candidate"; break; fi
          done
          if [[ -z "$GCOV" ]]; then
              echo "::error::Could not find conda's gcov under ${CONDA_PREFIX}/bin/" >&2
              find "${CONDA_PREFIX}/bin/" -maxdepth 1 -iname '*gcov*' >&2 || true
              exit 1
          fi
          echo "Using gcov: $GCOV"

          # --gcov-tool: the runner's system gcov is older than the conda gcc and rejects its .gcda files.
          # --ignore-errors inconsistent: lcov 2.x errors on gcc's line ranges for Catch2 template registrars.
          # --parallel 4 is pinned, not nproc, to bound peak memory: lcov's --memory limit needs Memory::Process,
          # which conda lacks.
          lcov --gcov-tool "$GCOV" --ignore-errors inconsistent --capture --directory . --output-file coverage.info \
            --parallel 4 \
            --exclude \*/_deps/\* --exclude /usr/\* --exclude \*/einsums-env/\* \
            --exclude \*/tests/\* --exclude \*/doctests/\*

      - name: Upload C++ coverage to Codecov
        if: ${{ matrix.compiler == 'default' && matrix.blas == 'openblas' && matrix.variant == 'default' }}
        uses: codecov/codecov-action@v7
        with:
          directory: "${{github.workspace}}/src"
          working-directory: "${{github.workspace}}/src"
          disable_search: true
          files: ${{github.workspace}}/build/coverage.info
          flags: cpp,linux
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test (find_package) - consume installation
        working-directory: "${{github.workspace}}/src/testing/consume"
        shell: bash -l {0}
        run: |
          cmake -S . \
            -B build \
            -G Ninja \
            --log-level verbose \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX};${CONDA_PREFIX}/Library;${{ github.workspace }}/installed"
          cmake --build build
          ./build/HelloWorld
