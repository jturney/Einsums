name: Linux build and test workflow
on:
  workflow_call:
    inputs:
      build_ref:
        type: string
        required: false
      build_cache_suffix:
        type: string
        required: false
        default: "default"
      build_cache_size:
        type: string
        required: false
        default: 2G
      build_configure_extra_args:
        type: string
        required: false

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # compiler = default implies the default compiler for the platform; for linux this is gcc/g++.
        # clang is also available; merge_yml.py injects the matching conda toolchain.
        # intel (icx/icpx) lives in linux-intel-build.yml — it's gated to manual
        # runs because icpx's per-TU memory blows past the 16GB ubuntu-latest
        # runner even at -O0 -j1.
        compiler: [ default, clang ]
        blas: [ openblas, mkl ]
        build_type: [ RelWithDebInfo ]
        variant: [ default ]
        include:
          # openblas as well as default: keyed on the compiler alone this merged
          # into BOTH default legs, so the mkl leg paid for instrumentation and
          # an 8-minute lcov pass to upload a second copy of the same report.
          - compiler: default
            blas: openblas
            cmake_extra: >
              -DEINSUMS_WITH_COVERAGE=ON
          # EINSUMS_WITH_PROFILER=OFF swaps the whole instrumentation API for
          # no-op shims, so nothing in the default matrix compiles that branch.
          # One leg is enough to keep it from rotting again.
          - compiler: clang
            blas: openblas
            build_type: RelWithDebInfo
            variant: no-profiler
            cmake_extra: >
              -DEINSUMS_WITH_PROFILER=OFF
        exclude:
          # clang leg is openblas-only (mkl pairs with the intel toolchain).
          - compiler: clang
            blas: mkl

    name: "${{ matrix.compiler }} • ${{ matrix.blas }} • ${{ matrix.build_type }} • ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: $GITHUB_WORKSPACE/build_cache_${{ inputs.build_cache_suffix }}
      CCACHE_MAXSIZE: ${{ inputs.build_cache_size }}
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref }}
          path: src
          submodules: recursive

      - name: Cache Build Cache
        uses: actions/cache@v6
        with:
          path: build_cache_${{ inputs.build_cache_suffix }}
          key: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}-

      - name: Set up conda environment
        uses: ./src/.github/actions/setup-conda-env
        with:
          compiler: ${{ matrix.compiler }}
          blas: ${{ matrix.blas }}
          source-dir: src

      - name: Configure CMake
        run: |
          cmake \
            -G Ninja \
            -S "$GITHUB_WORKSPACE/src" \
            -B "$GITHUB_WORKSPACE/build" \
            -D EINSUMS_BUILD_PYTHON=ON \
            -D Python_EXECUTABLE="${CONDA_PREFIX}/bin/python3" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D CMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D CMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D EINSUMS_SHOW_WARNING=OFF \
            -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/installed" \
            -D CMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            ${{ matrix.cmake_extra }} ${{ inputs.build_configure_extra_args }}

      # No debug info, rather than the RelWithDebInfo default -g. The build type
      # stays RelWithDebInfo on purpose: -O2 is the codegen we want under test,
      # and switching to Release would move it to -O3, changing what CI actually
      # exercises and compiling slower for the privilege.
      #
      # Nothing in CI reads DWARF. A failing Catch2 assertion reports its file
      # and line from __FILE__/__LINE__ captured at compile time, not from debug
      # info, and coverage comes out of .gcno/.gcda, which --coverage emits
      # independently. What is given up is a symbolized stack trace on a hard
      # crash; the sanitizer leg keeps -g1 precisely because a TSan report
      # without line numbers is close to useless, and that leg is where a crash
      # is worth reading.
      #
      # For a template library this size the debug info IS most of the object,
      # and the cache stores entries zstd-compressed, so the compressed number
      # is the one that matters. Measured on the real sources:
      #
      #                             raw -g    raw -g0   zstd -g   zstd -g0
      #   Graph.cpp                 26.4MB     4.2MB     4.94MB     0.56MB
      #   ContractionPlanning.cpp    6.7MB     0.6MB     1.18MB     0.09MB
      #
      # ~9-13x in the cache. That is what lets a whole build fit under
      # CCACHE_MAXSIZE, which it did not at -g (2.0/2.0GB, 964 self-evictions
      # DURING one build, so objects were discarded before the next run could
      # use them). Peak compiler RSS and link-time memory drop with it.
      - name: Build and Install
        run: |
          # Ninja parallelism is capped to fit the 16GB GitHub Linux runner:
          # heavy template instantiations (ComputeGraph + TensorAlgebra) peak at
          # ~3-4GB per TU under -O2 and ninja's default (nproc+2 = 6) OOM-kills
          # the runner mid-link. Dropping debug info buys back enough headroom
          # for a third worker; -j4 is very likely fine now too but has not been
          # demonstrated on the runner, and an OOM costs more than a core earns.
          cmake --build "${{ github.workspace }}/build" --config Release --target install -j3

      # - name: Linked dependencies, otool (M)
      #   if: runner.os == 'macOS'
      #   run: otool -L objdir/stage/lib/psi4/core.*.so

      # - name: Linked dependencies, objdump (W)
      #   if: runner.os == 'Windows'
      #   shell: cmd /C CALL {0}
      #   run: objdump.exe -p objdir\stage\lib\psi4\core.*.pyd | grep dll

      # The Python test suite is registered as ctest entries (labelled PYTHON)
      # by einsums_add_python_unit_test, so this single ctest run exercises both
      # the C++ and the Python bindings — no separate pytest step is needed.
      - name: ccache statistics
        run: ccache -sv 2>/dev/null || ccache -s

      - name: Test (CTest) - Unit Tests
        working-directory: "${{ github.workspace }}/build"
        run: ctest --rerun-failed --output-on-failure -j4

      - name: Generate coverage information
        if: ${{ matrix.compiler == 'default' && matrix.blas == 'openblas' }}
        working-directory: "${{github.workspace}}/build"
        run: |
          # Conda's gcc installs gcov as <arch>-conda-linux-gnu-gcov
          # (e.g. x86_64-conda-linux-gnu-gcov), NOT bare 'gcov'.
          # Hardcoding ${CONDA_PREFIX}/bin/gcov broke the step with
          # "geninfo: ERROR: need tool .../bin/gcov!" — that path doesn't
          # exist. Discover the arch-prefixed binary instead.
          GCOV=$(ls "${CONDA_PREFIX}"/bin/*-conda-linux-gnu-gcov 2>/dev/null | head -1)
          if [[ -z "$GCOV" ]]; then
              echo "::error::Could not find conda's gcov under ${CONDA_PREFIX}/bin/" >&2
              ls "${CONDA_PREFIX}/bin/" | grep -i gcov >&2 || true
              exit 1
          fi
          echo "Using gcov: $GCOV"

          export NOTES=$(find . -name "*.gcno")
          export SOURCES=$(for i in ${NOTES//.gcno/}; do echo "../src/$i"; done)
          echo "NOTES=$NOTES"
          echo "SOURCES=$SOURCES"
          # Use the conda gcov here too. The runner's system gcov 13.3
          # would produce .gcov files in the wrong format ("B33*") for our
          # gcc-15-built .gcda files ("B52*") even though the || swallows
          # the exit code.
          "$GCOV" -r $SOURCES || echo "returned $?"
          # Force lcov to use the conda env's gcov: the build is gcc 15 (.gcda
          # format "B52*"), but lcov can pick up the runner's system gcov 13.3
          # ("B33*") by default and bail with "geninfo: ERROR: GCOV failed ...
          # prefer version 'B33*'". Pinning --gcov-tool keeps the toolchain
          # consistent.
          lcov --gcov-tool "$GCOV" --capture --directory . --output-file coverage.info --exclude \*/_deps/\* --exclude /usr/\* --exclude \*/einsums-env/\*

      - name: Upload C++ coverage to Codecov
        if: ${{ matrix.compiler == 'default' && matrix.blas == 'openblas' }}
        uses: codecov/codecov-action@v7
        with:
          directory: "${{github.workspace}}/src"
          working-directory: "${{github.workspace}}/src"
          disable_search: true
          files: ${{github.workspace}}/build/coverage.info
          flags: cpp,linux
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test (find_package) - consume installation
        working-directory: "${{github.workspace}}/src/testing/consume"
        shell: bash -l {0}
        run: |
          cmake -S . \
            -B build \
            -G Ninja \
            --log-level verbose \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX};${CONDA_PREFIX}/Library;${{ github.workspace }}/installed"
          cmake --build build
          ./build/HelloWorld
