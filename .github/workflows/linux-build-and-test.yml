name: Linux build and test workflow
on:
  workflow_call:
    inputs:
      build_ref:
        type: string
        required: false
      build_cache_suffix:
        type: string
        required: false
        default: "default"
      build_cache_size:
        type: string
        required: false
        default: 2G
      build_configure_extra_args:
        type: string
        required: false

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # compiler = default implies the default compiler for the platform; for linux this is gcc/g++.
        # clang is also available; merge_yml.py injects the matching conda toolchain.
        # intel (icx/icpx) lives in linux-intel-build.yml — it's gated to manual
        # runs because icpx's per-TU memory blows past the 16GB ubuntu-latest
        # runner even at -O0 -j1.
        compiler: [ default, clang ]
        blas: [ openblas, mkl ]
        build_type: [ RelWithDebInfo ]
        variant: [ default ]
        include:
          # blas matters here: keyed on compiler alone this merges into both
          # default legs and runs coverage twice.
          - compiler: default
            blas: openblas
            cmake_extra: >
              -DEINSUMS_WITH_COVERAGE=ON
          # EINSUMS_WITH_PROFILER=OFF swaps the whole instrumentation API for
          # no-op shims, so nothing in the default matrix compiles that branch.
          # One leg is enough to keep it from rotting again.
          - compiler: clang
            blas: openblas
            build_type: RelWithDebInfo
            variant: no-profiler
            cmake_extra: >
              -DEINSUMS_WITH_PROFILER=OFF
          # Free-threaded CPython (cp314t). Guards two distinct things: that the
          # tree still compiles and links against the `t` ABI, and that nothing in
          # the bindings assumes the GIL exists. The second needs PYTHON_GIL=0 —
          # without it CPython re-enables the GIL on import, because _core does not
          # declare Py_MOD_GIL_NOT_USED, and the leg would silently test nothing new.
          #
          # Python_FIND_ABI's 4th field is the free-threaded flag (CMake 3.30+).
          # Without it FindPython refuses the t-build and quietly falls back to
          # another interpreter on the runner.
          #
          # Note this leg drives einsums from ONE python thread, so it does not
          # cover concurrent callers; the OpenMP-OpenBLAS hazard that free-threading
          # exposes needs a threaded caller to reproduce. See
          # docs/sphinx/building/blas_threading.rst.
          - compiler: default
            blas: openblas
            build_type: RelWithDebInfo
            variant: free-threaded
            free_threaded: true
            cmake_extra: >
              -DPython_FIND_ABI="OFF;ANY;ANY;ON"
              -DPython_ROOT_DIR="$CONDA_PREFIX"
              -DPython_FIND_STRATEGY=LOCATION
        exclude:
          # clang leg is openblas-only (mkl pairs with the intel toolchain).
          - compiler: clang
            blas: mkl

    name: "${{ matrix.compiler }} • ${{ matrix.blas }} • ${{ matrix.build_type }} • ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: $GITHUB_WORKSPACE/build_cache_${{ inputs.build_cache_suffix }}
      CCACHE_MAXSIZE: ${{ inputs.build_cache_size }}
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref }}
          path: src
          submodules: recursive

      - name: Cache Build Cache
        uses: actions/cache@v6
        with:
          path: build_cache_${{ inputs.build_cache_suffix }}
          key: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: einsums-${{ runner.os }}-${{ matrix.build_type }}-${{ inputs.build_cache_suffix }}-${{ matrix.compiler }}-${{ matrix.blas }}-${{ matrix.variant }}-

      - name: Set up conda environment
        uses: ./src/.github/actions/setup-conda-env
        with:
          compiler: ${{ matrix.compiler }}
          blas: ${{ matrix.blas }}
          source-dir: src
          free-threaded: ${{ matrix.free_threaded == true }}

      - name: Configure CMake
        run: |
          cmake \
            -G Ninja \
            -S "$GITHUB_WORKSPACE/src" \
            -B "$GITHUB_WORKSPACE/build" \
            -D EINSUMS_BUILD_PYTHON=ON \
            -D Python_EXECUTABLE="${CONDA_PREFIX}/bin/python3" \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D CMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D CMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG" \
            -D EINSUMS_SHOW_WARNING=OFF \
            -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/installed" \
            -D CMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            ${{ matrix.cmake_extra }} ${{ inputs.build_configure_extra_args }}

      - name: Build and Install
        run: |
          # -j3 fits the 16GB runner; heavy TUs peak at ~3-4GB and ninja's
          # default (nproc+2) OOM-kills the link.
          cmake --build "${{ github.workspace }}/build" --config Release --target install -j3

      # - name: Linked dependencies, otool (M)
      #   if: runner.os == 'macOS'
      #   run: otool -L objdir/stage/lib/psi4/core.*.so

      # - name: Linked dependencies, objdump (W)
      #   if: runner.os == 'Windows'
      #   shell: cmd /C CALL {0}
      #   run: objdump.exe -p objdir\stage\lib\psi4\core.*.pyd | grep dll

      # The Python test suite is registered as ctest entries (labelled PYTHON)
      # by einsums_add_python_unit_test, so this single ctest run exercises both
      # the C++ and the Python bindings — no separate pytest step is needed.
      - name: ccache statistics
        run: ccache -sv 2>/dev/null || ccache -s

      - name: Test (CTest) - Unit Tests
        working-directory: "${{ github.workspace }}/build"
        run: ctest --rerun-failed --output-on-failure -j4

      # The run above imports einsums with the GIL auto-re-enabled: CPython does
      # that for any extension that has not declared Py_MOD_GIL_NOT_USED, and
      # announces it with a RuntimeWarning. So by itself it only proves the tree
      # works against the `t` ABI. PYTHON_GIL=0 overrides the fallback and runs
      # the bindings with no GIL at all, which is the state declaring the opt-in
      # would make permanent.
      - name: Test (CTest) - Python suite with the GIL disabled
        if: ${{ matrix.variant == 'free-threaded' }}
        working-directory: "${{ github.workspace }}/build"
        # PYTHON_GIL is deliberately NOT a step-level env var. The step shell is
        # `bash -el`, a LOGIN shell, so it sources the profile and conda's
        # activation runs Python before any of this script does. With the
        # variable set for the whole step that startup Python aborts with
        #   Fatal Python error: config_read_gil: Disabling the GIL is not
        #   supported by this build
        # and the step dies before reaching the command it was meant for. Scope
        # it to the two processes that should see it instead.
        run: |
          # Use the interpreter CMake resolved, not whatever `python` is on
          # PATH. FindPython picks the t-build via Python_FIND_ABI, but the
          # conda env's default `python` can be the regular-ABI one, and
          # PYTHON_GIL=0 on that aborts rather than being ignored:
          #   Fatal Python error: config_read_gil: Disabling the GIL is not
          #   supported by this build
          # It is also the interpreter the ctest Python tests launch.
          PY=$(grep '^Python_EXECUTABLE:' CMakeCache.txt | cut -d= -f2-)
          echo "using $PY"
          # Assert after the import, not just at startup: the point is that
          # loading _core did not flip the GIL back on and reduce this to a
          # duplicate of the run above.
          PYTHONPATH="${{ github.workspace }}/build/lib" PYTHON_GIL=0 "$PY" -c "
          import sys, einsums
          assert not sys._is_gil_enabled(), 'importing einsums re-enabled the GIL'
          print('GIL still disabled after importing einsums')
          "
          PYTHON_GIL=0 ctest -L PYTHON --output-on-failure -j4

      - name: Generate coverage information
        if: ${{ matrix.compiler == 'default' && matrix.blas == 'openblas' && matrix.variant == 'default' }}
        working-directory: "${{github.workspace}}/build"
        run: |
          # Conda's gcc installs gcov as <arch>-conda-linux-gnu-gcov
          # (e.g. x86_64-conda-linux-gnu-gcov), NOT bare 'gcov'.
          # Hardcoding ${CONDA_PREFIX}/bin/gcov broke the step with
          # "geninfo: ERROR: need tool .../bin/gcov!" — that path doesn't
          # exist. Discover the arch-prefixed binary instead.
          GCOV=$(ls "${CONDA_PREFIX}"/bin/*-conda-linux-gnu-gcov 2>/dev/null | head -1)
          if [[ -z "$GCOV" ]]; then
              echo "::error::Could not find conda's gcov under ${CONDA_PREFIX}/bin/" >&2
              ls "${CONDA_PREFIX}/bin/" | grep -i gcov >&2 || true
              exit 1
          fi
          echo "Using gcov: $GCOV"

          export NOTES=$(find . -name "*.gcno")
          export SOURCES=$(for i in ${NOTES//.gcno/}; do echo "../src/$i"; done)
          echo "NOTES=$NOTES"
          echo "SOURCES=$SOURCES"
          # Use the conda gcov here too. The runner's system gcov 13.3
          # would produce .gcov files in the wrong format ("B33*") for our
          # gcc-15-built .gcda files ("B52*") even though the || swallows
          # the exit code.
          "$GCOV" -r $SOURCES || echo "returned $?"
          # Force lcov to use the conda env's gcov: the build is gcc 15 (.gcda
          # format "B52*"), but lcov can pick up the runner's system gcov 13.3
          # ("B33*") by default and bail with "geninfo: ERROR: GCOV failed ...
          # prefer version 'B33*'". Pinning --gcov-tool keeps the toolchain
          # consistent.
          lcov --gcov-tool "$GCOV" --capture --directory . --output-file coverage.info --exclude \*/_deps/\* --exclude /usr/\* --exclude \*/einsums-env/\*

      - name: Upload C++ coverage to Codecov
        if: ${{ matrix.compiler == 'default' && matrix.blas == 'openblas' && matrix.variant == 'default' }}
        uses: codecov/codecov-action@v7
        with:
          directory: "${{github.workspace}}/src"
          working-directory: "${{github.workspace}}/src"
          disable_search: true
          files: ${{github.workspace}}/build/coverage.info
          flags: cpp,linux
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test (find_package) - consume installation
        working-directory: "${{github.workspace}}/src/testing/consume"
        shell: bash -l {0}
        run: |
          cmake -S . \
            -B build \
            -G Ninja \
            --log-level verbose \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX};${CONDA_PREFIX}/Library;${{ github.workspace }}/installed"
          cmake --build build
          ./build/HelloWorld
