# Contains necessary packages for a GCC or Clang build using OpenBLAS
# Usable with x86_64 or ARM64 architectures
name: einsums-dev
channels:
 - conda-forge
 - nodefaults
dependencies:
 # Use Python 3.13
 - python=3.13
 - debugpy
 # CMake Tools
 - cmake
 - ninja
 - ccache
 # GNU Compilers
 - cxx-compiler
 - gdb
 # LLVM Compilers
 - clang
 - clangxx
 - llvm-openmp
 - compiler-rt
 - lldb
 # Necessary for cpptrace
 - clang-tools
 - libclang
 # OpenBLAS
 - libblas[build=*openblas]
 - openblas[build=*openmp*]
 # Prebuilts to save einsums the work
 # apiary: libclang codegen for the Python bindings and the C++ API reference,
 # plus the APIARY_* annotation macros every translation unit includes
 - apiary >=1.3.1,<2
 - catch2
 - fftw
 # clang 22 / macOS libc++ needs fmt 12 (11.0.x fails consteval, 11.1+ fails the malloc allocator)
 - fmt >=12,<13
 # The exact version Einsums_SetupSpdlog pins (EINSUMS_SPDLOG_VERSION): any other is passed over
 # and spdlog is quietly built from source instead. conda-forge builds it against fmt 12.1, which
 # holds fmt there too.
 - spdlog 1.17.0
 # HDF5
 # * zlib brings headers; hdf5 package only bring libzlib
 - hdf5
 - zlib
 - mimalloc >=3.3,<3.7,!=3.4.0,!=3.4.1
 # Python
 - pybind11
 - pytest
 - numpy
 - scipy
 # Coverage and Testing
 - lcov
 - pre-commit
