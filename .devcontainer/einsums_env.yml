# Contains necessary packages for a GCC or Clang build using OpenBLAS
# Usable with x86_64 or ARM64 architectures
name: einsums-dev
channels:
 - conda-forge
 - nodefaults
dependencies:
 # Use Python 3.13
 - python=3.13
 - debugpy
 # CMake Tools
 - cmake
 - ninja
 - ccache
 # GNU Compilers
 - cxx-compiler
 - gdb
 # LLVM Compilers
 - clang
 - clangxx
 - llvm-openmp
 - compiler-rt
 - lldb
 # Necessary for cpptrace
 - clang-tools
 - libclang
 # OpenBLAS
 - libblas[build=*openblas]
 - openblas[build=*openmp*]
 # Prebuilts to save einsums the work
 # apiary: libclang codegen for the Python bindings and the C++ API reference,
 # plus the APIARY_* annotation macros every translation unit includes
 - apiary >=1,<2
 - catch2
 - fftw
 # clang 22 / macOS libc++ needs fmt 12 (11.0.x fails consteval, 11.1+ fails the malloc allocator)
 - fmt >=12,<13
 # No spdlog: Einsums builds it from source against fmt 12 (Einsums_SetupSpdlog), because conda has
 # none that is fmt-12-compatible. Installing one anyway is actively harmful - the conda compiler
 # wrapper puts $PREFIX/include on the search path, so its headers shadow the ones Einsums vendored.
 # HDF5
 # * zlib brings headers; hdf5 package only bring libzlib
 - hdf5
 - zlib
 - mimalloc >=3.3,<3.6,!=3.4.0,!=3.4.1
 # Python
 - pybind11
 - pytest
 - numpy
 - scipy
 # Coverage and Testing
 - lcov
 - pre-commit
