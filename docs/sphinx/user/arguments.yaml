# The prose half of the command-line argument reference.
#
# docs/sphinx/user/arguments.rst is generated by docs/tools/generate_arguments_rst.py
# from two inputs: the C++ option descriptors in
# libs/Einsums/<Module>/include/Einsums/<Module>/Options.hpp, which say which
# options exist and how each one is invoked, and this file, which says what each
# one means. Neither half can be written down twice, so an option's name, type,
# default, category, and value placeholder are never repeated here.
#
# One entry per option, keyed by the descriptor's own long name (no leading
# dashes). Every registered option needs one and only registered options may
# appear: the generator fails the build on either mismatch, which is what makes
# adding an option without documenting it impossible.
#
#   added        the release the option first appeared in (required)
#   added_text   an optional paragraph under that versionadded directive
#   changed      optional history, each entry a version and its text
#   body         the reStructuredText shown under the option, indented into
#                place by the generator
#
# Bodies are ordinary reST and may use any role the manual has: the generator
# copies them through untouched. It does check every ``--einsums:...`` spelling
# a body names against the registry, including the ``no-`` negations, because a
# hand-written negation that never parsed is precisely how this page went wrong
# before. Version history is exempt from that check, since it describes names
# that deliberately no longer exist.

"einsums:max-memory":
  added: "2.1.0"
  body: |
    Ceiling on the memory Einsums plans against. It takes a string containing a number and
    units; see :cpp:func:`einsums::string_util::memory_string`. Set to ``0`` to disable.

    Defaults to 80% of the machine's physical RAM.

    This is a planning ceiling, not an allocator meter: chunked algorithms size their working
    sets to it, and :cpp:class:`einsums::MemoryPool` refuses a reservation that would push the
    process's total pooled bytes past it - at the reserve site, on the pool's owning thread,
    before the OS is asked for anything. Ordinary tensor allocations are not checked against
    it, which is what keeps the check from ever throwing inside a kernel.

"einsums:buffer-size":
  added: "1.0.0"
  body: |
    The amount of memory Einsums is allowed to use. It takes a string containing a number and units.
    The units are either bytes or words. See :cpp:func:`einsums::string_util::memory_string` for more information.

    Defaults to ``64MB``.
    The ceiling exists to catch a runaway temporary with a named error, not to ration legitimate
    workspace; the default is sized so a wide machine's worth of concurrent contractions fits
    under it with room to spare.

"einsums:work-buffer-size":
  added: "1.0.0"
  body: |
    The largest buffer size to use for buffered contractions. This should be much smaller than
    :option:`--einsums:buffer-size`, whose value has to cover roughly three buffers per thread along with
    everything else the program needs. Setting it to zero lets Einsums decide.

"einsums:row-major":
  added: "2.0.0"
  added_text: |
    The setting was read from the tensor constructors in earlier releases but no option ever set it.
  body: |
    Construct tensors in row-major order rather than column-major.

    Off by default: Einsums tensors are column-major at construction, which is what the BLAS and LAPACK
    backends expect.

"einsums:log:level":
  added: "1.0.0"
  changed:
    - version: "1.1.0"
      text: |
        This option now also sets the HIP log level if Einsums was built with GPU support.
    - version: "2.0.0"
      text: |
        This option no longer sets the HIP log level. Use the :code:`AMD_LOG_LEVEL` environment variable.
        This option's name has also been changed.
  body: |
    Set the level to see in the logger. Lower values provide more information. By default, it is set to
    3 for the release build and 2 for the debug build.

    * 0: Tracing messages. Very verbose.
    * 1: Debugging messages.
    * 2: Information messages
    * 3: Warnings.
    * 4: Errors.
    * 5: Critical errors.

"einsums:log:destination":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed.
  body: |
    Set whether the logger will log to standard output or standard error.

"einsums:log:format":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed.
  body: |
    A format string used for the logger output.

"einsums:profile:disable":
  added: "2.0.0"
  body: |
    Do not record profiling zones or annotations at all. This is a large speedup for workloads made of
    many small operations, where the bookkeeping can cost more than the work being measured.

"einsums:profile:report":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed, and again later in the 2.0.0 cycle to its positive spelling.
  body: |
    Write the profiling report when the program exits. On by default; turn it off with
    ``--einsums:profile:no-report``.

"einsums:profile:filename":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed.
  body: |
    The name of the file for the profiler output. Defaults to ``profile.txt``.

"einsums:profile:append":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed to its positive spelling. It was previously documented as
        ``--einsums:profiler:no-append``, which never parsed.
  body: |
    Append the profiling information to the profiling file rather than truncating it. On by default;
    turn it off with ``--einsums:profile:no-append``.

"einsums:profile:detailed":
  added: "2.0.0"
  body: |
    Print a detailed profile report rather than the summary.

"einsums:profile:save":
  added: "2.0.0"
  body: |
    Save the profile session as JSON for the imgui viewer. Empty, the default, means do not save one.

"einsums:profile:server":
  added: "2.0.0"
  body: |
    Run the profile server, so a viewer can attach and stream this process's profiling data.

    Off by default. The server is a cost a run should opt into rather than one it pays for having
    been built with profiling: it holds a listening socket for the life of the process and is
    driven by the consumer thread, which services it on the same periodic tick that drains the
    event buffers.

    It streams JSON Lines over TCP, binds to ``127.0.0.1``, and accepts up to four simultaneous
    clients. There is no authentication and no transport security of any kind, so the loopback
    bind is what keeps it private and is not something to work around. On macOS it also advertises
    itself over Bonjour as ``_einsums-profile._tcp``.

    See :option:`--einsums:profile:port` for the port it listens on, and
    :option:`--einsums:profile:wait-for-viewer` to hold a short run open until a viewer has
    attached.

"einsums:profile:port":
  added: "2.0.0"
  body: |
    The port the profile server listens on. Defaults to ``19216``.

"einsums:profile:wait-for-viewer":
  added: "2.0.0"
  body: |
    Block at startup until a profiler viewer connects, so that a short run cannot finish before the
    viewer has attached.

"einsums:pass:disable":
  added: "2.0.0"
  body: |
    Comma-separated list of optimization pass names to skip when ``PassManager::run()``
    is called. Use this to A/B test whether a specific pass helps or hurts performance.

    Example: ``--einsums:pass:disable CSE,Reorder``

"einsums:graph:dump-regions":
  added: "2.0.0"
  body: |
    Dump the algebra each region rewrite raised, before and after it rewrote, in the algebraic
    form rather than as a node list.

    This is the first thing to turn on when an optimized graph produces a wrong number. A diff of
    two node-list dumps tells you which nodes changed; a diff of the algebra tells you what the
    rewrite *claimed*, which is where the mistake actually is. Output goes to stderr at pass
    verbosity 2 and above, and is also kept on the pass so a test can read it.

    Costs one rendering per region, so it is off by default.

"einsums:graph:structural-search":
  added: "2.0.0"
  body: |
    Let the structural-algebraic phase run its **search** passes, which is
    ``MultiTermFactorization`` today.

    Off by default, and the default is the point rather than caution. Every other pass in that
    phase is a recognizer: it walks the graph once and its runtime is a function of the node
    count. A search pass's runtime is a function of how many candidates the graph offers, which
    nobody can predict from outside, and the saved graph IR exists precisely so that a search runs
    ONCE and a replay does not.

    So the interactive default is off, and the capture-optimize-save workflow turns it on
    deliberately. A caller who wants it for one pipeline can switch it on there instead:
    ``MultiTermFactorization::set_search_enabled`` overrides this option in both directions, which
    is also what makes two pipelines with different settings runnable at the same time.

    See also :option:`--einsums:graph:optimizer-budget`, which bounds how long the search may run.

"einsums:graph:factorization-cache":
  added: "2.0.0"
  body: |
    Keep each search pass's chosen plan in memory and replay it when a structurally identical
    graph comes back. On by default.

    The search ``MultiTermFactorization`` runs is a pure function of the region's structure, so
    its answer is worth keeping. An entry is keyed on :cpp:func:`einsums::compute_graph::Graph::content_hash` together
    with the region's node span and the factor cap, and it holds a *plan* rather than a graph: the
    shared pairs that were committed, in order, and the contraction tree chosen for each term,
    written as positions rather than as tensor identities so a plan found on one graph applies to
    another that hashes the same.

    The case it pays for is a pipeline whose stages present the same program under the same name:
    the first stage searches and the rest replay. It does not pay for re-running a script, which
    is a new process with an empty cache; that case is what saving the optimized graph IR is for.
    A search that ran out of its budget is never kept, so a plan that comes back out is one an
    unbounded search would have found.

    ``MultiTermFactorization::set_cache_enabled`` overrides this for one pipeline and
    ``clear_cache`` empties it. Switch it off when bisecting a wrong number: two supposedly
    identical graphs getting one plan is the first thing to rule out.

"einsums:graph:factorization-max-factors":
  added: "2.0.0"
  body: |
    The largest number of factors a term may have before ``MultiTermFactorization`` declines it
    instead of searching it.

    The cap is a property of the *program* a caller brings rather than of the pass, which is why
    it is an option. A density-fitted opposite-spin correlation energy, flattened through its
    direct product and its dot, is nine leaves; the same energy through a grid fit is fourteen;
    an amplitude residual term is more. A cap chosen for the first of those declines the other
    two silently, and a caller has no way to lift it without editing the pass.

    The cost is stated rather than hidden. The per-term program is ``3^N`` in the factor count, so
    fourteen leaves is a few million subset splits and runs in seconds, and twenty is over three
    billion and does not finish unaided. A value in the twenties is therefore a request to run
    under :option:`--einsums:graph:optimizer-budget` and keep the best tree found when it expires,
    which is what that budget was built to do. Raising this changes what the search is *offered*
    and never how the search itself scales.

    ``MultiTermFactorization::set_max_factors`` overrides this for one pipeline, in both
    directions. A pass that builds its own cone out of a provider's factors, which
    ``FactorizationPass`` does, knows how many leaves it is about to hand over and takes this as a
    floor rather than a ceiling.

"einsums:graph:factorization-max-readers":
  added: "2.1.0"
  body: |
    How many consumers a definition may be inlined into before ``MultiTermFactorization`` leaves
    it whole.

    An author-named intermediate several statements read is inlined into each of them whose
    bracketing it improves and kept for the rest, so a value two consumers want no longer pins the
    algebra around it. Every copy is a term of its own, which is the growth this bounds: the search
    sees as many terms as the copies it made, and each of them is capped by
    :option:`--einsums:graph:factorization-max-factors` separately. Raising this costs search time
    linearly where raising the factor cap costs it exponentially.

    Four is the default because the shapes that ask for this have two or three consumers, a
    correlation energy split into its spin halves and an integral a residual reads from two routes,
    and because a value more consumers than that read is far more likely to be a quantity the
    program genuinely shares than an artifact of how the author bracketed it. A definition past the
    cap is reported through the pass's skip tally rather than dropped silently.

    A copy is never emitted for its own sake: a consumer that gains nothing from the inlining reads
    the definition instead, and the whole rewrite is still measured against the captured bracketing
    before anything is emitted.

    ``MultiTermFactorization::set_max_readers`` overrides this for one pipeline, in both directions.

"einsums:graph:tiling-memory-cap":
  added: "2.1.0"
  body: |
    Largest a single live intermediate may be, in bytes, before ``AxisTiling`` rewrites the program
    as a loop over slices of its free axes.

    This is a resource knob and not a tolerance. Nothing about tiling trades accuracy: the algebra
    at one slice is the algebra the capture wrote, and the only thing that moves is which axes are
    loop variables and which are tensor axes. What the pass does owe is the summation order of the
    reduction it turns into an accumulation across iterations, which is why it declares the
    re-associating tier.

    The number is read three times. It decides *whether* to tile, since a program whose largest
    intermediate already fits is declined and left alone. It decides *which* axes, since the pass
    keeps the candidate set that streams the fewest bytes among those that bring the footprint
    under the cap. And it decides *how deep*, since the chunk is the largest number of slices whose
    intermediates still fit.

    Zero disables the pass. The default is deliberately far above any program that needs tiling,
    because slicing a program that already fits costs kernel efficiency for memory nobody was
    short of; the pass should fire when a caller states a footprint they have to live inside.

"einsums:graph:thc-epsilon":
  added: "2.0.0"
  body: |
    Relative error a ``ThcFactorization`` asserts for the grid fit it substitutes for a tagged
    four-index tensor, when the caller states none of its own.

    A *tolerance*, spelled the way every per-lossy-pass knob is, and it reaches the PROVIDER
    rather than living in a pass, so a graph saved after a grid fit means one thing wherever it
    is loaded.

    What it is not is a measurement. The error of a tensor-hypercontraction fit against the
    exact four-index tensor cannot be computed without forming the tensor the fit exists to
    avoid, so the number in the approximation record is the caller's assertion, exactly as the
    density fit's is. What IS measured, on every bind, is the least-squares residual of the grid
    fit against the three-index tensor it was fitted from: two parameters named by
    ``ThcFactorization.residual_param_name`` and ``ThcFactorization.reference_param_name``,
    whose ratio's square root is the relative residual. A residual far above this option is the
    signal that the grid was too coarse for the accuracy the record claims.

    The grid itself is not chosen here. The pass takes the collocation matrix it is handed, and
    pruning a grid is a setup the caller performs; this option says what the result is asserted
    to be worth and the measured residual says whether the grid delivered it.

"einsums:graph:naf-threshold":
  added: "2.1.0"
  body: |
    Fraction of the largest singular value below which a ``NaturalAuxiliaryFactorization`` drops
    an auxiliary direction, when the caller states no threshold of its own.

    A *tolerance*, spelled the way every per-lossy-pass knob is, and it reaches the PROVIDER
    rather than living in a pass, so a graph saved after a truncation means one thing wherever it
    is loaded. Loosening it shrinks the auxiliary index and grows the error; at water/cc-pVDZ a
    threshold of ``1e-1`` keeps 39 of 84 auxiliary functions and ``1e-2`` keeps 61.

    RELATIVE, where the drop threshold of a metric fit is absolute, and the difference is where
    the two guards run. A metric fit's is a captured element operation whose policy number is
    bound when its executor is built, so a relative cutoff there needs a reduction feeding a value
    into a guard. This one runs in ordinary code at optimize time over eigenvalues held in a local
    buffer, where comparing against the largest of them costs nothing.

    What the record carries is not this number. The exact tensor is the one being truncated and
    the truncation reads it, so the error is measured rather than claimed: the norm of the dropped
    singular values against the norm of all of them. That number is a bound on the tensor and
    therefore a loose one on any energy computed from it.

    The spectrum is read off the eigenvalues of the Gram matrix, which are the squares of the
    singular values, so a singular value is resolved to about the square root of machine epsilon.
    A threshold below ``1e-8`` is asking the fit to distinguish a numerically absent direction
    from a genuinely small one, which it cannot.

"einsums:graph:fno-occupation":
  added: "2.1.0"
  body: |
    Occupation below which ``BasisTruncation`` drops a natural orbital from the correlated
    space, when the caller states no cutoff of its own.

    A *tolerance*, spelled the way every per-lossy-pass knob is, and ABSOLUTE where the auxiliary
    truncation's threshold is relative: an occupation number already is a fraction, since it says
    how much of an electron a virtual orbital carries, and the conventional cutoffs are quoted as
    such rather than against whichever orbital happens to be the most occupied.

    It reaches the PASS rather than a provider, because a basis truncation factors nothing: it
    replaces one index space by a contained subspace and projects every tensor that runs over the
    space it replaced.

    What the approximation record carries is not this number. It is the MP2 correlation energy the
    truncation removed, measured at optimize time from the amplitudes the pass was handed, which is
    an absolute energy-like effect rather than a relative one.

    Loosening it shrinks the virtual index and removes more correlation energy. At water/cc-pVDZ
    the natural occupations run from ``2.3e-2`` down to ``4.7e-5`` over 19 virtual orbitals, so a
    cutoff of ``1e-3`` keeps 9 of them and one of ``1e-4`` keeps 17; there is no cutoff that halves
    that molecule's virtual space cheaply, which is a property of a small basis rather than of the
    method.

"einsums:graph:laplace-epsilon":
  added: "2.0.0"
  body: |
    Target relative accuracy for the quadrature ``LaplaceTransform`` substitutes for a tagged
    energy denominator.

    A *tolerance* rather than a point count, deliberately. A tolerance composes with the accuracy
    budget and is what an approximation record can state; a count is a means, and the same count
    over a wider spectral range is a different approximation that says nothing about what the
    result is worth. The count is derived from this option together with the range of the signed
    energy sum the bound orbital energies form, and it reaches the setup node's descriptor, so a
    graph saved here means the same thing wherever it is loaded.

    The rule is the truncated trapezoidal sum of the exponential integral on a logarithmic grid.
    Its three error terms, the discretization and the two truncations, are each bounded
    analytically and are given half, a quarter and a quarter of the target between them, which
    is what fixes the grid. Tightening the tolerance shrinks the step, so the point count and the
    arithmetic the rewrite emits both grow roughly with the logarithm of the reciprocal
    tolerance; on a typical orbital-energy range, ``1e-4`` needs around twenty points and
    ``1e-6`` around forty.

    ``LaplaceTransform::set_epsilon`` overrides this for one pipeline, and
    ``LaplaceTransform::set_points`` overrides the derived count outright, which exists for
    reproducing a published number rather than for ordinary use. The error the rule actually
    reaches is measured rather than assumed: it is recorded on the graph as an approximation
    record, and it is measured again on every bind into the tensor
    ``LaplaceTransform::error_tensor_name`` names.

"einsums:graph:optimizer-budget":
  added: "2.0.0"
  body: |
    Wall-clock allowance in milliseconds for each search pass. Zero means unlimited.

    A pass that exhausts its allowance keeps the best candidate it had found, applies it, and
    reports that it was cut off, so running out of time costs optimization rather than correctness
    or determinism. ``PassManager.explain()`` says which happened, because a report that could not
    tell "this graph was already optimal" from "I ran out of time on the first candidate" would be
    silent in exactly the case a budget exists for.

    The default is a starting point rather than a measurement, which is what an option is for.
    ``PassManager::set_optimizer_budget`` overrides it for one pipeline.

"einsums:pass:analyze":
  added: "2.0.0"
  body: |
    Run all passes in analysis-only mode. Each pass executes normally and reports what
    it found, but the graph is restored to its original state afterward. No modifications
    persist.

"einsums:pass:verbose":
  added: "2.0.0"
  body: |
    Log node count and wall-clock time before and after each optimization pass, even for
    passes that don't modify the graph.

"einsums:pass:verbosity":
  added: "2.0.0"
  body: |
    How much the optimization passes narrate: ``0`` silent, ``1`` a summary line per pass, ``2`` each
    modification and each declined candidate, ``3`` the per-candidate detail behind a decline.

    A program that calls ``PassManager.set_verbosity`` chooses its own level and this leaves it alone;
    the option supplies a level only where nothing else did.

    This is the only way to observe a **thread plan**. ``Graph.plan_threads()`` builds its planner
    directly rather than through a pass manager, so at level ``0`` it reports nothing and whether it
    widened any node, or declined and at which gate, cannot be seen from the outside. At ``1`` it
    says how many nodes it widened, to what width, and the makespan it expected; at ``2`` it names
    every node and its width.

    Distinct from :option:`--einsums:pass:verbose`, which logs node count and timing around each pass
    and says nothing about what a pass decided.

"einsums:graph:profile-groups":
  added: "2.0.0"
  body: |
    Break a grouped batched GEMM into one profiler zone per shape class.

    This deliberately changes how the contraction runs: it takes the slower unfused form, because a
    per-group breakdown of one parallel loop is not obtainable any other way. Read it for where the
    arithmetic is, not for what the node costs.

"einsums:graph:verify-levels":
  added: "2.0.0"
  body: |
    Before each level-scheduled replay, check that no execution level holds two nodes touching
    overlapping storage.

    On by default in debug builds. This option is how a release build turns it on, which is what a
    nondeterministic result wants. It costs a second pass over every operand and can report a conflict
    it cannot disprove.

"einsums:gpu:disable":
  added: "2.0.0"
  body: |
    Keep every node on the host, making the GPU placement pass a no-op.

"einsums:hardware:profile":
  added: "2.0.0"
  body: |
    Build the cost model from a calibrated hardware profile instead of the built-in device table.

    The passes that must choose between alternatives - ``ContractionPlanning``'s chain ordering,
    ``GEMMBatching``'s profitability gate, ``GPUPlacement`` - price their candidates against a
    ``CostModel``. Left unset, that model comes from a table of measured devices matched against this
    machine's brand string, which is a generic answer for a machine the table names and a guess for one
    it does not. Point this at the JSON the ``calibrate_hardware`` tool writes and the measured GEMM
    efficiency curve and bandwidths are used instead.

    A path that will not load is a warning and a fall back to the built-in table, never an error: the
    profile shapes which optimization is chosen, never whether the answer is right.

    Read once per cost model, while a pass manager is being populated, so it is settled well before
    any graph executes.

"einsums:hptt:selection-method":
  added: "2.0.0"
  body: |
    The plan selection method used by the tensor transpose backend: one of ``estimate``, ``measure``,
    ``patient``, or ``crazy``. Defaults to ``estimate``. The later methods spend more time choosing a
    plan in exchange for a faster transpose, which pays off when one plan is reused many times.

"einsums:scratch-dir":
  added: "1.0.0"
  body: |
    The scratch directory for Einsums tensor files. Defaults to the system temporary directory.

"einsums:hdf5-file-name":
  added: "1.0.0"
  body: |
    The name of the HDF5 scratch file. The default carries the process id, so concurrent runs do not
    collide.

"einsums:delete-hdf5-files":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed to its positive spelling.
  body: |
    Clean up the HDF5 scratch file on exit. On by default; keep the file for inspection with
    ``--einsums:no-delete-hdf5-files``.

"einsums:debug:install-signal-handlers":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed, and again later in the 2.0.0 cycle to its positive spelling.
  body: |
    Install Einsums' custom signal handlers. On by default; turn them off with
    ``--einsums:debug:no-install-signal-handlers``, which is what a host process that installs its own
    handlers wants.

"einsums:debug:attach-debugger":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed, and again later in the 2.0.0 cycle to its positive spelling.
        Its default has also changed from on to off.
  body: |
    Offer the chance to attach a debugger when an error is detected.

    Off by default, because the offer BLOCKS: a process that hits an error waits for a human who,
    in a test harness or a batch job, is not there. Turn it on with
    ``--einsums:debug:attach-debugger`` when you are at the keyboard and want the process held open
    at the point of failure.

"einsums:debug:diagnostics-on-terminate":
  added: "1.0.0"
  changed:
    - version: "2.0.0"
      text: |
        This option's name has been changed, and again later in the 2.0.0 cycle to its positive spelling.
  body: |
    Print extra diagnostics on termination. On by default; turn it off with
    ``--einsums:debug:no-diagnostics-on-terminate``.

"einsums:debug:crash-handler":
  added: "2.0.0"
  body: |
    Install the crash handler that reports a fatal exception and writes a minidump. On by default;
    turn it off with ``--einsums:debug:no-crash-handler``.

    Deliberately separate from :option:`--einsums:debug:install-signal-handlers`. On Windows the two
    are different mechanisms, since signals never see a memory fault there, so a Python process can
    keep its own faulthandler on the signals and still get a report out of a hard crash.

"einsums:debug:crash-dump-dir":
  added: "2.0.0"
  body: |
    Directory for crash minidumps. Empty, the default, means the working directory.

