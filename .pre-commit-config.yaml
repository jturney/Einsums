repos:
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.10
    hooks:
      - id: cmake-format
        name: Ensure CMake files are formatted correctly
        files: (CMakeLists.txt|.*\.cmake)$
        exclude: (.*cmake-build-.*|.*build/.*)
        additional_dependencies: [ cmake-format==0.6.10 ]
        args: [ "-c", ".cmake-format.py" ]

  - repo: local
    hooks:
      - id: cmake-audit
        name: Audit CMake files for undefined-variable typos
        entry: tools/cmake-audit/cmake_audit.py
        language: python
        files: (CMakeLists.txt|.*\.cmake)$
        exclude: (.*cmake-build-.*|.*build/.*|.*\.einsums-studio/.*)

      # A bare `namespace einsums { }` compiles and works; its symbols are just
      # not ABI-versioned, so a second copy of libEinsums in the process can
      # interpose on them. Nothing else notices, which is why this is a hook.
      # pass_filenames is off because the check scans every tracked file: the
      # sweep that introduced these macros used a *.hpp/*.cpp glob and missed
      # generated .hpp.in templates, an Objective-C++ .mm backend, and the
      # .fstring skeletons stamped into every new module.
      - id: einsums-namespace-macros
        name: Ensure einsums namespaces are opened with EINSUMS_NAMESPACE_BEGIN
        entry: devtools/check_namespace_macros.py
        language: python
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        name: Ensure C++ files are formatted correctly
        files: \.(cpp|hpp)$
        exclude: (.*cmake-build-.*|.*build/.*)
        args: [ --style=file ]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.4
    hooks:
      - id: insert-license
        name: "Check license: C++"
        files: \.(cpp|hpp)$
        exclude: (.*cmake-build-.*|.*build/.*)
        args:
          - --license-filepath
          - devtools/LicenseHeader.txt
          - --comment-style
          - "//----------------------------------------------------------------------------------------------|//|//----------------------------------------------------------------------------------------------"
          - --detect-license-in-X-top-lines=3

      - id: insert-license
        name: "Check license: CMake"
        files: (CMakeLists.txt|.*\.cmake)$
        exclude: (.*cmake-build-.*|.*build/.*)
        args:
          - --license-filepath
          - devtools/LicenseHeader.txt
          - --comment-style
          - "#----------------------------------------------------------------------------------------------|#|#----------------------------------------------------------------------------------------------"
          - --detect-license-in-X-top-lines=3

      - id: insert-license
        name: "Check license: Python"
        files: \.py$
        exclude: (.*cmake-build-.*|.*build/.*)
        args:
          - --license-filepath
          - devtools/LicenseHeader.txt
          - --comment-style
          - "#"
          - --detect-license-in-X-top-lines=3
